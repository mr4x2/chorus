storage:
  defaultRegion: "vn-central-1"
  storages:
    main:
      defaultRegion: "vn-central-1"
      address: "http://localhost:9000"  # This might be misconfigured or offline
      credentials:
        user1:
          accessKeyID: "xxx"
          secretAccessKey: "xxx"
      provider: "Ceph"
      isMain: true
      healthCheckInterval: 10s
      healthCheckEnabled: false  # Disable health checks to prevent shutdown
      httpTimeout: 1m
      isSecure: true
      rateLimit:
        enabled: false
        rpm: 60

    follower:
      defaultRegion: "vn-north-1"
      address: "http://localhost:9001"  # This might also be misconfigured
      credentials:
        user1:
          accessKeyID: "xxx"
          secretAccessKey: "xxx"
      provider: "Ceph"
      isMain: false
      healthCheckInterval: 10s
      healthCheckEnabled: false  # Disable health checks to prevent shutdown
      httpTimeout: 1m
      isSecure: true
      rateLimit:
        enabled: false
        rpm: 60
