api:
  enabled: true # set true to enable management api
  grpcPort: 9670
  httpPort: 9671
  secure: false
log:
  json: false # false for dev console logger, true - json log for prod to export to Grafana&Loki.
  level: info
metrics:
  enabled: false
  port: 9090
database:
  # dsn: "host=127.0.0.1 port=5432 user=chorus password=secret dbname=chorus sslmode=disable TimeZone=UTC"
  host: "postgres"
  port: 5432 
  user: "chorus"
  password: "secret"
  name: "chorus"
  sslmode: "disable"
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "1h"
  connMaxIdleTime: "15m"
  logLevel: "warn"
  useForReplication: true
  # Resilience configuration for database operations
  resilience:
    # Retry configuration
    maxRetries: 3
    retryDelay: "100ms"
    retryMultiplier: 2.0
    maxRetryDelay: "5s"
    # Circuit breaker configuration
    failureThreshold: 5
    recoveryTimeout: "30s"
    halfOpenMaxCalls: 3
    # Timeout configuration
    operationTimeout: "10s"
trace:
  enabled: false
  endpoint: # url to Jaeger or other open trace provider
redis:
  address: "redis:6379"
features:
  tagging: false # sync object/bucket tags
  acl: false # sync object/bucket ACLs
  lifecycle: false # sync bucket Lifecycle
  policy: false # sync bucket Policies
  preserveACLGrants: false # preserve object/bucket ACL Grants from source

