api:
  enabled: true # set true to enable management api
  grpcPort: 9670
  httpPort: 9671
  secure: false
log:
  json: false # false for dev console logger, true - json log for prod to export to Grafana&Loki.
  level: info
metrics:
  enabled: false
  port: 9090
database:
  # dsn: "host=127.0.0.1 port=5432 user=chorus password=secret dbname=chorus sslmode=disable TimeZone=UTC"
  host: "postgres"
  port: 5432 
  user: "chorus"
  password: "secret"
  name: "chorus"
  sslmode: "disable"
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: "1h"
  connMaxIdleTime: "15m"
  logLevel: "warn"
  useForReplication: true
trace:
  enabled: false
  endpoint: # url to Jaeger or other open trace provider
redis:
  address: "redis:6379"
features:
  tagging: false # sync object/bucket tags
  acl: false # sync object/bucket ACLs
  lifecycle: false # sync bucket Lifecycle
  policy: false # sync bucket Policies
  preserveACLGrants: false # preserve object/bucket ACL Grants from source

